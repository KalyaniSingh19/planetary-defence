<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Close Approach Explorer</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2/plotly.min.js"></script>
</head>
<body>
<header class="topbar">
  <h1>☄️ Planetary Defense Dashboard</h1>
  <nav>
    <a href="index.html">Home</a>
    <a href="page1.html">Overview</a>
    <a href="page2.html" class="active">Explorer</a>
    <a href="page3.html">Characteristics</a>
    <a href="page4.html">Discovery</a>
    <a href="page5.html">Data Quality</a>
    <a href="page6.html">Asteroid Detail</a>
  </nav>
</header>
<main>
  <div class="panel">
    <h2>How close is "close"? Drag the threshold.</h2>
    <div class="controls">
      <input type="range" id="ldSlider" min="0.5" max="20" step="0.5" value="5" style="flex:1;">
      <span id="ldValue" style="min-width:80px;">5.0 LD</span>
    </div>
  </div>

  <div class="kpi-row" id="kpis"></div>

  <div class="panel">
    <h2>Distance vs. Velocity (bubble size = diameter, color = PHA)</h2>
    <div id="scatterChart" style="height:520px;"></div>
  </div>
</main>
<script src="js/page2.js"></script>
</body>
</html>
